[platformio]
default_envs = sticks3

[env:sticks3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.35/platform-espressif32.zip
board = esp32-s3-devkitc1-n8r8
framework = arduino
lib_deps =
    m5stack/M5Unified@0.2.29
    m5stack/M5GFX@0.2.36
    h2zero/NimBLE-Arduino@2.5.2
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -D CORE_DEBUG_LEVEL=1
    -std=gnu++17
build_unflags = -std=gnu++11
monitor_speed = 115200
upload_speed = 921600
