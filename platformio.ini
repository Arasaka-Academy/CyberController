[platformio]
default_envs = sticks3

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.35/platform-espressif32.zip
framework = arduino
lib_deps =
    m5stack/M5GFX@0.2.36
    m5stack/M5Unified@0.2.29
    h2zero/NimBLE-Arduino@2.5.2
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -D CORE_DEBUG_LEVEL=1
    -std=gnu++17
build_unflags = -std=gnu++11
monitor_speed = 115200
upload_speed = 921600

[env:sticks3]
board = esp32-s3-devkitc1-n8r8
build_src_filter = +<*> -<devices/atoms3_pyramid.cpp> -<wifi*.cpp>

[env:atoms3-pyramid]
board = m5stack-atoms3
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
build_src_filter = +<*> -<devices/sticks3.cpp> -<ble.cpp>
lib_deps =
    m5stack/M5GFX@0.2.36
    m5stack/M5Unified@0.2.29
    links2004/WebSockets@2.7.1
    https://github.com/m5stack/M5Echo-Pyramid.git#773d837cb1e30452a6e4e8b02de1ad6b97eeffd2
build_flags =
    ${env.build_flags}
    -D CYBERCONTROLLER_ATOMS3_PYRAMID=1
